<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/gala/icon.svg" type="image/svg+xml">
  <title>@TITLE@ · Gala</title>
  <style>
    :root{--card:#1c1c1e;--fill:rgba(118,118,128,.24);--secondary:rgba(235,235,245,.6);--tertiary:rgba(235,235,245,.3);
      --accent:#ff7b5c;--accent-fill:#e4583a;--red:#ff453a;color-scheme:dark;
      font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#fff;background:#000;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}
    body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;margin:0;
      padding:calc(env(safe-area-inset-top) + 20px) max(24px,env(safe-area-inset-left)) max(24px,env(safe-area-inset-bottom))}
    body::before{content:"";position:fixed;inset:0 0 auto;height:560px;z-index:-1;pointer-events:none;
      background:radial-gradient(60% 70% at 88% -10%,rgba(255,123,92,.2),transparent 70%),
                 radial-gradient(55% 65% at 5% -15%,rgba(46,125,82,.26),transparent 70%)}
    a{color:var(--accent);text-decoration:none;-webkit-tap-highlight-color:transparent}
    .back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;min-height:44px;font-size:17px}
    .back svg{width:12px;height:20px}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:360px;margin:0 auto;padding-bottom:6vh;text-align:center}
    .icon{position:relative;display:grid;place-items:center;width:120px;height:120px;border-radius:27px;overflow:hidden;
      background:linear-gradient(160deg,#ff9a7a,#e4583a);color:#fff;font:600 54px/1 ui-rounded,-apple-system,system-ui,sans-serif;
      box-shadow:0 18px 50px rgba(0,0,0,.5)}
    .icon::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
    .icon img{width:100%;height:100%;display:block}
    h1{margin:22px 0 0;font-size:28px;line-height:1.15;font-weight:700;overflow-wrap:anywhere}
    .version{margin:4px 0 0;color:var(--secondary);font-size:17px}
    #install{display:grid;place-items:center;width:100%;height:52px;margin-top:32px;border-radius:26px;background:var(--accent-fill);
      color:#fff;font-weight:600;transition:transform .12s,opacity .15s}
    #install:active{transform:scale(.97)}
    .progress{width:100%;margin-top:32px}
    .track{height:6px;overflow:hidden;border-radius:3px;background:var(--fill)}
    .fill{height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .3s linear}
    .track.waiting .fill{width:30%;animation:wait 1.3s ease-in-out infinite}
    @keyframes wait{from{transform:translateX(-110%)}to{transform:translateX(340%)}}
    #stage{margin:12px 0 0;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
    #stage.warn{color:var(--red)}
    .hint{min-height:40px;margin:6px 0 0;color:var(--tertiary);font-size:13px;line-height:1.5}
    [hidden]{display:none!important}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <a class="back" href="/gala/"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>Builds</a>
  <main>
    <div class="icon" id="icon" aria-hidden="true"></div>
    <h1>@TITLE@</h1>
    <p class="version">Build @VERSION@</p>
    <a id="install" href="@INSTALL_URL@">Install</a>
    <div class="progress" id="progress" hidden>
      <div class="track waiting" id="track" role="progressbar" aria-label="Download" aria-valuemin="0" aria-valuemax="100">
        <div class="fill" id="fill"></div>
      </div>
      <p id="stage" role="status" aria-live="polite">Starting…</p>
    </div>
    <p class="hint" id="hint">Keep Tailscale connected while it downloads.</p>
  </main>
  <script>
    const attempt = "@ATTEMPT@";
    const title = document.querySelector("h1").textContent.trim();
    const icon = document.getElementById("icon");
    const iconUrl = "@ICON@";
    if (iconUrl) {
      const image = new Image();
      image.alt = "";
      image.onload = () => { icon.style.background = "none"; icon.replaceChildren(image); };
      image.src = iconUrl;
    }
    icon.textContent = (title[0] || "?").toUpperCase();

    const install = document.getElementById("install");
    const progress = document.getElementById("progress");
    const track = document.getElementById("track");
    const fill = document.getElementById("fill");
    const stage = document.getElementById("stage");
    const hint = document.getElementById("hint");
    let startedAt = 0;

    function show(text, {percent = null, warn = false, retry = false, note = ""} = {}) {
      stage.textContent = text;
      stage.classList.toggle("warn", warn);
      track.classList.toggle("waiting", percent === null && !retry);
      if (percent !== null) {
        fill.style.width = percent + "%";
        track.setAttribute("aria-valuenow", String(percent));
      }
      install.hidden = !retry;
      install.textContent = "Try Again";
      if (note) hint.textContent = note;
    }

    async function poll() {
      if (!startedAt) return;
      try {
        const response = await fetch("status.json?attempt=" + attempt, {cache: "no-store"});
        if (!response.ok) throw new Error();
        const state = await response.json();
        if (state.stage === "ready" || state.stage === "manifest") {
          if (Date.now() - startedAt > 30000) show("Didn’t start", {retry: true, note: "Tap Try Again, then Install in the iOS prompt."});
        } else if (state.stage === "downloading") {
          const percent = Math.min(100, Math.round(100 * state.sent / Math.max(1, state.total)));
          show("Downloading · " + percent + "%", {percent});
        } else if (state.stage === "transferred") {
          show("Installing on this device", {percent: 100, note: "When the icon finishes, fully close and reopen the app."});
          startedAt = 0;
        } else if (state.stage === "interrupted") {
          show("Download interrupted", {warn: true, retry: true, note: "Check Tailscale, then try again."});
          startedAt = 0;
        } else if (state.stage === "superseded") {
          show("A newer build is ready", {retry: true, note: "Reload to get the latest build."});
          install.textContent = "Reload";
          install.href = location.pathname;
          startedAt = 0;
        }
      } catch (_) {
        hint.textContent = "Can’t reach your Mac. Check Tailscale.";
      }
    }

    function begin() {
      progress.hidden = false;
      fill.style.width = "0";
      show("Starting…");
      startedAt = Date.now();
      poll();
    }

    install.addEventListener("click", () => { if (install.textContent !== "Reload") begin(); });
    setInterval(poll, 700);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
    if (new URLSearchParams(location.search).has("install")) {
      setTimeout(() => { begin(); location.href = install.href; }, 150);
    }
  </script>
</body>
</html>
