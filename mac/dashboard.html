<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gala">
  <link rel="manifest" href="/gala/manifest.webmanifest">
  <link rel="icon" href="/gala/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/gala/icon-512.png">
  <title>Gala</title>
  <style>
    :root{
      --bg:#000;--card:#1c1c1e;--card-hover:#232325;--fill:rgba(118,118,128,.24);
      --label:#fff;--secondary:rgba(235,235,245,.6);--tertiary:rgba(235,235,245,.3);
      --accent:#ff7b5c;--accent-soft:rgba(255,123,92,.17);--accent-fill:#e4583a;--red:#ff453a;
      --top:env(safe-area-inset-top);--gutter:max(20px,env(safe-area-inset-left));
      --glass:rgba(40,40,44,.5);--rim:inset 0 .5px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.08);
      color-scheme:dark;font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
      color:var(--label);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh}
    body::before{content:"";position:fixed;inset:0 0 auto;height:520px;z-index:-1;pointer-events:none;
      background:radial-gradient(60% 70% at 88% -10%,rgba(255,123,92,.2),transparent 70%),
                 radial-gradient(55% 65% at 5% -15%,rgba(46,125,82,.26),transparent 70%)}
    button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    [hidden]{display:none!important}

    /* Floating chrome: a soft scroll-edge blur, compact title, and one glass control. */
    .edge{position:fixed;inset:0 0 auto;height:calc(var(--top) + 60px);z-index:5;pointer-events:none;opacity:0;
      background:linear-gradient(#000c,#0000);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
      -webkit-mask-image:linear-gradient(#000 55%,#0000);mask-image:linear-gradient(#000 55%,#0000);transition:opacity .2s}
    .compact{position:fixed;left:0;right:0;top:calc(var(--top) + 12px);z-index:6;text-align:center;font-weight:600;
      pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
    .scrolled .edge{opacity:1}.scrolled .compact{opacity:1;transform:none}
    .glass-button{position:fixed;z-index:7;top:calc(var(--top) + 6px);right:max(var(--gutter),calc((100vw - 1080px)/2 + var(--gutter)));
      display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--glass);box-shadow:var(--rim),0 6px 18px rgba(0,0,0,.35);
      -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);transition:transform .15s,background .15s}
    .glass-button:active{transform:scale(.9)}
    .glass-button svg{width:21px;height:21px}
    .glass-button.on{color:var(--accent)}
    .glass-button.pending::after{content:"";position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #2a2a2e}

    .page{max-width:1080px;margin:0 auto;padding:calc(var(--top) + 56px) var(--gutter) max(40px,env(safe-area-inset-bottom))}
    h1{margin:0 0 18px;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em}

    .tip{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:12px 12px 12px 14px;border-radius:20px;background:var(--card);animation:rise .3s ease-out}
    .tip-icon{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
    .tip-icon svg{width:19px;height:19px}
    .tip-copy{flex:1;min-width:0}
    .tip-copy strong{display:block;font-size:15px;font-weight:600}
    .tip-copy p{margin:1px 0 0;color:var(--secondary);font-size:13px;line-height:1.35}
    .tip-close{display:grid;place-items:center;flex:none;width:30px;height:30px;margin:-4px -2px -4px -4px;border-radius:50%;color:var(--tertiary)}
    .tip-close svg{width:12px;height:12px}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
    .app{display:flex;align-items:center;gap:14px;min-width:0;padding:14px 16px 14px 14px;border-radius:24px;background:var(--card);animation:rise .3s ease-out both;transition:background .15s}
    @media(hover:hover){.app:hover{background:var(--card-hover)}}
    .icon{position:relative;display:grid;place-items:center;flex:none;width:60px;height:60px;border-radius:13.5px;overflow:hidden;
      color:#fff;font:600 27px/1 ui-rounded,-apple-system,system-ui,sans-serif}
    .icon::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
    .icon img{width:100%;height:100%;display:block}
    .meta{flex:1;min-width:0}
    .name{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
    .detail{display:block;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--secondary);font-size:15px;font-variant-numeric:tabular-nums}
    .detail.warn{color:var(--red)}

    .pill{position:relative;display:grid;place-items:center;flex:none;min-width:78px;height:32px;padding:0 16px;border-radius:16px;
      background:var(--accent-soft);color:var(--accent);font-size:15px;font-weight:700;letter-spacing:-.01em;transition:transform .12s,background .15s,opacity .15s}
    .pill::before{content:"";position:absolute;inset:-6px -4px}
    .pill:active{transform:scale(.93)}
    .pill.quiet{background:var(--fill);color:var(--secondary)}
    .pill.busy{min-width:32px;width:32px;padding:0;background:none;cursor:default;margin-left:23px;margin-right:23px}
    .pill.busy:active{transform:none}
    .pill svg{display:block;width:32px;height:32px;animation:pop .2s ease-out}
    .ring{transform:rotate(-90deg)}
    .ring circle{fill:none;stroke-width:3}
    .ring .track{stroke:var(--fill)}
    .ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
    .spin{animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(270deg)}}
    @keyframes pop{from{transform:scale(.6);opacity:0}}
    @keyframes rise{from{transform:translateY(6px);opacity:0}}

    .notice{display:flex;flex-direction:column;align-items:center;max-width:340px;margin:12vh auto 0;text-align:center}
    .notice svg{width:52px;height:52px;margin-bottom:14px;color:var(--tertiary)}
    .notice h2{margin:0;font-size:22px;font-weight:700}
    .notice p{margin:6px 0 0;color:var(--secondary);font-size:15px;line-height:1.45}
    .notice code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--label)}
    .notice .pill{margin-top:20px}

    .toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 12px));z-index:9;max-width:calc(100vw - 40px);
      padding:12px 20px;border-radius:24px;background:var(--glass);box-shadow:var(--rim),0 10px 30px rgba(0,0,0,.45);
      -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
      font-size:15px;font-weight:600;text-align:center;opacity:0;transform:translate(-50%,12px) scale(.96);pointer-events:none;transition:opacity .2s,transform .25s}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media(min-width:700px){:root{--gutter:max(32px,env(safe-area-inset-left))}.page{padding-top:calc(var(--top) + 64px)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="edge" aria-hidden="true"></div>
  <div class="compact" aria-hidden="true">Builds</div>
  <button class="glass-button" id="alerts" type="button" aria-label="Build alerts"></button>
  <main class="page">
    <h1 id="title">Builds</h1>
    <div class="tip" id="tip" hidden>
      <span class="tip-icon" aria-hidden="true"></span>
      <div class="tip-copy"><strong id="tip-title"></strong><p id="tip-text"></p></div>
      <button class="pill" id="tip-action" type="button" hidden>Turn On</button>
      <button class="tip-close" id="tip-close" type="button" aria-label="Dismiss"></button>
    </div>
    <section class="grid" id="list" aria-label="Builds"></section>
    <div class="notice" id="notice" hidden>
      <span id="notice-icon" aria-hidden="true"></span>
      <h2 id="notice-title"></h2>
      <p id="notice-text"></p>
      <button class="pill" id="notice-action" type="button" hidden>Try Again</button>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const base = "/gala";
    const $ = id => document.getElementById(id);
    const svg = {
      bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6.5-2.5 8-2.5 8h17S18 15 18 8.5"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>',
      bellOn: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6.5-2.5 8-2.5 8h17S18 15 18 8.5"/><path d="M10 20a2.2 2.2 0 0 0 4 0" fill="none"/></svg>',
      bellOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3.7A6 6 0 0 1 18 8.5c0 3 .5 5 1.2 6.3M16.5 16.5h-13S6 15 6 8.5c0-.7.1-1.3.3-1.9"/><path d="M10 20a2.2 2.2 0 0 0 4 0M3 3l18 18"/></svg>',
      close: '<svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg>',
      check: '<svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14.5" style="fill:var(--accent)"/><path d="M10 16.5l4 4 8-9" stroke="#1c1c1e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      spinner: '<svg class="ring spin" viewBox="0 0 32 32"><circle class="track" cx="16" cy="16" r="13"/><circle class="bar" cx="16" cy="16" r="13" pathLength="100" stroke-dasharray="22 100"/></svg>',
      ring: '<svg class="ring" viewBox="0 0 32 32"><circle class="track" cx="16" cy="16" r="13"/><circle class="bar" cx="16" cy="16" r="13" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>',
      stack: '<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M26 7 45 17 26 27 7 17Z"/><path d="m7 26 19 10 19-10M7 35l19 10 19-10" stroke-linecap="round"/></svg>',
      offline: '<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 20a29 29 0 0 1 40 0M13 28a19 19 0 0 1 26 0M20 35.5a9 9 0 0 1 12 0"/><circle cx="26" cy="42" r="1.6" fill="currentColor"/><path d="M8 8l36 36"/></svg>'
    };
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    const store = {
      get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (_) { return fallback; } },
      set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }
    };

    let toastTimer;
    function toast(message) {
      const element = $("toast");
      element.textContent = message;
      element.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => element.classList.remove("show"), 2600);
    }

    // Large title collapses into a compact one, like a native navigation bar.
    new IntersectionObserver(([entry]) => document.body.classList.toggle("scrolled", !entry.isIntersecting),
      {rootMargin: "-40px 0px 0px 0px"}).observe($("title"));

    /* Builds */
    const list = $("list");
    const rows = new Map();
    const palettes = [["#ff9a7a", "#e4583a"], ["#6fcf8e", "#2e7d52"], ["#6cb4ff", "#2f6fe0"],
                      ["#c29bff", "#7a4fe0"], ["#ffd06b", "#e8912f"], ["#5fd8cc", "#1e8f88"]];
    let loaded = false;

    function ago(seconds) {
      const minutes = Math.floor((Date.now() / 1000 - seconds) / 60);
      if (minutes < 1) return "Just now";
      if (minutes < 60) return minutes + "m ago";
      const hours = Math.floor(minutes / 60);
      return hours < 24 ? hours + "h ago" : Math.floor(hours / 24) + "d ago";
    }

    function paintIcon(row) {
      const {item, icon} = row;
      if (item.icon) {
        const src = base + "/" + item.icon;
        if (icon.dataset.src === src) return;
        icon.dataset.src = src;
        icon.style.background = "var(--fill)";
        const image = new Image();
        image.alt = "";
        image.onload = () => icon.replaceChildren(image);
        image.src = src;
        return;
      }
      if (icon.dataset.src === "") return;
      icon.dataset.src = "";
      const hash = [...item.project].reduce((sum, c) => (sum * 31 + c.charCodeAt(0)) >>> 0, 7);
      const [from, to] = palettes[hash % palettes.length];
      icon.style.background = `linear-gradient(160deg, ${from}, ${to})`;
      icon.textContent = (item.title.trim()[0] || "?").toUpperCase();
    }

    function paint(row) {
      const {item, state, detail, button} = row;
      row.name.textContent = item.title;
      paintIcon(row);
      detail.classList.toggle("warn", state?.stage === "failed");
      detail.textContent = state?.stage === "waiting" ? "Starting…"
        : state?.stage === "downloading" ? "Downloading…"
        : state?.stage === "done" ? "Finishing on this device…"
        : state?.stage === "failed" ? state.message
        : "Build " + item.version + " · " + ago(item.published_at);
      const busy = state && state.stage !== "failed";
      button.classList.toggle("busy", !!busy);
      button.disabled = !!busy;
      if (busy) {
        const kind = state.stage === "downloading" ? "ring" : state.stage === "done" ? "check" : "spinner";
        if (button.dataset.kind !== kind) { button.dataset.kind = kind; button.innerHTML = svg[kind]; }
        const percent = Math.round(100 * (state.fraction || 0));
        if (kind === "ring") button.querySelector(".bar").style.strokeDashoffset = String(100 - percent);
        button.setAttribute("role", "progressbar");
        button.setAttribute("aria-valuenow", String(percent));
        button.setAttribute("aria-label", item.title + ": " + detail.textContent);
        return;
      }
      button.removeAttribute("role");
      button.removeAttribute("aria-valuenow");
      button.dataset.kind = "label";
      const installed = store.get("gala.installed", {})[item.project];
      const label = !isIOS ? "Get IPA" : state ? "Retry" : installed === item.sha256 ? "Installed" : installed ? "Update" : "Install";
      button.textContent = label;
      button.classList.toggle("quiet", label === "Installed");
      button.setAttribute("aria-label", (label === "Installed" ? "Reinstall " : label + " ") + item.title);
    }

    function createRow(item) {
      const el = document.createElement("article");
      el.className = "app";
      el.innerHTML = '<span class="icon" aria-hidden="true"></span><div class="meta"><span class="name"></span><span class="detail"></span></div><button class="pill" type="button"></button>';
      const row = {el, item, state: null, icon: el.querySelector(".icon"), name: el.querySelector(".name"),
                   detail: el.querySelector(".detail"), button: el.querySelector(".pill")};
      row.button.addEventListener("click", () => install(row));
      return row;
    }

    function install(row) {
      const {item} = row;
      const project = encodeURIComponent(item.project);
      if (!isIOS) {
        location.href = `${base}/${project}/current.ipa?sha256=${item.sha256}`;
        return;
      }
      const token = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
      fetch(`${base}/${project}/attempt?attempt=${token}`, {method: "POST", keepalive: true}).catch(() => {});
      // Navigate inside the tap: iOS ignores itms-services links opened after an await.
      const manifest = `${location.origin}${base}/${project}/manifest.plist?sha256=${item.sha256}&attempt=${token}`;
      location.href = "itms-services://?action=download-manifest&url=" + encodeURIComponent(manifest);
      follow(row, token);
    }

    async function follow(row, token) {
      const started = Date.now();
      const project = encodeURIComponent(row.item.project);
      const sha = row.item.sha256;
      const current = () => row.state?.token === token;
      row.state = {stage: "waiting", token};
      paint(row);
      let misses = 0;
      while (current()) {
        await sleep(document.hidden ? 1500 : 500);
        if (!current()) return;
        let status;
        try {
          const response = await fetch(`${base}/${project}/status.json?attempt=${token}`, {cache: "no-store"});
          status = response.status === 404 ? {stage: "ready"} : await response.json();
          misses = 0;
        } catch (_) {
          if (++misses < 6) continue;
          row.state = {stage: "failed", token, message: "Lost connection to your Mac"};
          paint(row);
          return;
        }
        if (status.stage === "ready" || status.stage === "manifest") {
          // No request usually means the iOS prompt was cancelled.
          if (Date.now() - started > 45000) { row.state = null; paint(row); return; }
        } else if (status.stage === "downloading") {
          row.state = {stage: "downloading", token, fraction: status.sent / Math.max(1, status.total)};
          paint(row);
        } else if (status.stage === "transferred") {
          store.set("gala.installed", {...store.get("gala.installed", {}), [row.item.project]: sha});
          row.state = {stage: "done", token};
          paint(row);
          await sleep(4000);
          if (current()) { row.state = null; paint(row); }
          return;
        } else if (status.stage === "interrupted") {
          row.state = {stage: "failed", token, message: "Download interrupted"};
          paint(row);
          return;
        } else if (status.stage === "superseded") {
          row.state = null;
          toast("A newer build is ready");
          loadBuilds();
          return;
        }
      }
    }

    function notice(kind) {
      const empty = kind === "empty";
      $("notice-icon").innerHTML = empty ? svg.stack : svg.offline;
      $("notice-title").textContent = empty ? "No Builds" : "Can’t Reach Your Mac";
      $("notice-text").innerHTML = empty
        ? "Run <code>gala deliver</code> in a project and it will show up here."
        : "Make sure Tailscale is connected on this device.";
      $("notice-action").hidden = empty;
      $("notice").hidden = false;
    }

    async function loadBuilds() {
      let items;
      try {
        const response = await fetch(base + "/projects.json", {cache: "no-store"});
        if (!response.ok) throw new Error();
        items = await response.json();
      } catch (_) {
        if (!loaded) notice("offline");
        return;
      }
      loaded = true;
      const seen = new Set();
      items.forEach((item, index) => {
        seen.add(item.project);
        let row = rows.get(item.project);
        if (!row) { row = createRow(item); rows.set(item.project, row); }
        row.item = item;
        paint(row);
        if (list.children[index] !== row.el) list.insertBefore(row.el, list.children[index] || null);
      });
      for (const [project, row] of rows) {
        if (!seen.has(project)) { row.el.remove(); rows.delete(project); }
      }
      $("notice").hidden = true;
      if (!items.length) notice("empty");
    }

    $("notice-action").addEventListener("click", loadBuilds);
    loadBuilds();
    setInterval(() => { if (!document.hidden) loadBuilds(); }, 10000);
    setInterval(() => rows.forEach(row => { if (!row.state) paint(row); }), 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) loadBuilds(); });

    /* Build alerts */
    let registration, vapidKey, alerts = "loading";
    const bell = $("alerts");

    function keyBytes(encoded) {
      const padded = encoded.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(encoded.length / 4) * 4, "=");
      return Uint8Array.from(atob(padded), c => c.charCodeAt(0));
    }

    function paintAlerts() {
      bell.innerHTML = alerts === "on" ? svg.bellOn : alerts === "blocked" || alerts === "unsupported" ? svg.bellOff : svg.bell;
      bell.classList.toggle("on", alerts === "on");
      const dismissed = store.get("gala.tip.dismissed", false);
      const tip = alerts === "home-screen" ? ["Get build alerts", "Tap Share, then Add to Home Screen."]
        : alerts === "off" ? ["Build alerts", "Get notified when a build is ready."] : null;
      bell.classList.toggle("pending", !!tip && dismissed);
      bell.setAttribute("aria-label", alerts === "on" ? "Build alerts are on" : "Build alerts");
      $("tip").hidden = !tip || dismissed;
      if (!tip) return;
      $("tip-title").textContent = tip[0];
      $("tip-text").textContent = tip[1];
      $("tip-action").hidden = alerts !== "off";
    }

    async function prepareAlerts() {
      if (isIOS && !standalone) { alerts = "home-screen"; return; }
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) { alerts = "unsupported"; return; }
      registration = await navigator.serviceWorker.register(base + "/sw.js", {scope: base + "/"});
      const response = await fetch(base + "/config.json", {cache: "no-store"});
      if (!response.ok) { alerts = "unsupported"; return; }
      vapidKey = keyBytes((await response.json()).publicKey);
      alerts = Notification.permission === "denied" ? "blocked"
        : Notification.permission === "granted" && await registration.pushManager.getSubscription() ? "on" : "off";
    }

    async function enableAlerts() {
      if (!registration || !vapidKey) { toast("Still loading. Try again in a moment."); return; }
      try {
        // Keep subscribe directly in the tap handler: iOS requires a user gesture.
        const subscription = await registration.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: vapidKey});
        const response = await fetch(base + "/subscribe", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({subscription: subscription.toJSON(), device: navigator.userAgent})
        });
        if (!response.ok) throw new Error();
        alerts = "on";
        toast("Build alerts are on");
      } catch (_) {
        alerts = Notification.permission === "denied" ? "blocked" : "off";
        toast(alerts === "blocked" ? "Notifications are off in Settings" : "Couldn’t turn on alerts");
      }
      paintAlerts();
    }

    bell.addEventListener("click", () => {
      if (alerts === "off") return enableAlerts();
      if (alerts === "home-screen") { store.set("gala.tip.dismissed", false); paintAlerts(); return; }
      toast({on: "Build alerts are on", blocked: "Allow Gala notifications in Settings",
             unsupported: "This browser can’t show build alerts", loading: "Checking alerts…"}[alerts]);
    });
    $("tip-action").addEventListener("click", enableAlerts);
    $("tip-close").innerHTML = svg.close;
    $("tip-close").addEventListener("click", () => { store.set("gala.tip.dismissed", true); paintAlerts(); });
    document.querySelector(".tip-icon").innerHTML = svg.bell;
    paintAlerts();
    prepareAlerts().catch(() => { alerts = "unsupported"; }).finally(paintAlerts);
  </script>
</body>
</html>
