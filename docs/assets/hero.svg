<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Gala Engine</title>
  <desc id="desc">A private Mac build engine for iPhone and iPad apps developed from Linux.</desc>
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2b6146"/>
      <stop offset="1" stop-color="#123322"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb18a"/>
      <stop offset="1" stop-color="#ec765c"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="1200" height="440" rx="32" fill="url(#green)"/>
  <circle cx="1072" cy="76" r="230" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="52"/>
  <circle cx="50" cy="410" r="170" fill="#bcdf99" opacity=".11" filter="url(#blur)"/>
  <g transform="translate(55 58) scale(.94)">
    <rect width="78" height="78" rx="21" fill="#133523"/>
    <path d="M39 25c-8-6-21-5-25 4-8 18 6 36 17 34 4-1 5-3 8-3s4 2 8 3c11 2 25-16 17-34-4-9-17-10-25-4Z" fill="url(#peach)"/>
    <path d="M40 24c3-11 11-17 22-18-2 12-11 19-22 18Z" fill="#cce8ad"/>
  </g>
  <text x="55" y="174" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="61" font-weight="760" letter-spacing="-3">Gala Engine</text>
  <text x="58" y="217" fill="#cce8d0" font-family="system-ui,Arial,sans-serif" font-size="21">iOS builds from your Linux machine. One Mac does the Apple part.</text>
  <rect x="56" y="258" width="365" height="92" rx="18" fill="#0f2d20" stroke="#8cba95" stroke-opacity=".32"/>
  <circle cx="78" cy="281" r="5" fill="#ef8b74"/>
  <circle cx="96" cy="281" r="5" fill="#e7bd7c"/>
  <circle cx="114" cy="281" r="5" fill="#9bcf94"/>
  <text x="77" y="323" fill="#ddf0de" font-family="ui-monospace,SFMono-Regular,monospace" font-size="23">$ gala deliver</text>
  <text x="58" y="395" fill="#9fc6a6" font-family="system-ui,Arial,sans-serif" font-size="15" letter-spacing="1.2">SYNC   →   TEST   →   BUILD   →   SIGN   →   INSTALL</text>
  <g transform="translate(785 33)">
    <rect x="0" y="0" width="282" height="484" rx="47" fill="#111d17" stroke="#c8d5c7" stroke-width="6"/>
    <rect x="11" y="11" width="260" height="462" rx="38" fill="#f6f5ef"/>
    <rect x="99" y="17" width="84" height="17" rx="9" fill="#111d17"/>
    <text x="29" y="70" fill="#203c2a" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="760">Gala</text>
    <rect x="27" y="91" width="228" height="151" rx="22" fill="#22513a"/>
    <text x="44" y="123" fill="#cbe7cc" font-family="system-ui,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">YOUR PRIVATE BUILD STATION</text>
    <text x="44" y="160" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="740">Fresh builds.</text>
    <text x="44" y="189" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="740">Ready for you.</text>
    <text x="28" y="280" fill="#25412e" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="700">Current builds</text>
    <rect x="27" y="297" width="228" height="103" rx="19" fill="#fff" stroke="#dae5d7"/>
    <rect x="43" y="312" width="42" height="42" rx="13" fill="#dbebc5"/>
    <text x="57" y="342" fill="#2f6542" font-family="system-ui,Arial,sans-serif" font-size="24" font-weight="700">S</text>
    <text x="95" y="330" fill="#233b2a" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="700">SwiftTodo</text>
    <text x="95" y="348" fill="#809286" font-family="system-ui,Arial,sans-serif" font-size="11">Build 4 · 66 KB</text>
    <rect x="43" y="363" width="196" height="25" rx="12" fill="#e77861"/>
    <text x="104" y="380" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="700">Install update</text>
  </g>
</svg>
