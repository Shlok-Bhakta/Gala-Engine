<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 305" role="img" aria-labelledby="title desc">
  <title id="title">Gala build flow</title>
  <desc id="desc">A Linux checkout syncs code to a Mac over Tailscale. The Mac tests, builds, and signs an IPA. A native iPhone or iPad app receives the current build over private HTTPS.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f8f2"/><stop offset="1" stop-color="#eef4e8"/></linearGradient>
  </defs>
  <rect width="1200" height="305" rx="26" fill="url(#bg)"/>
  <text x="40" y="48" fill="#284632" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="760">How a build gets to your device</text>
  <g transform="translate(48 90)">
    <rect width="280" height="160" rx="22" fill="#fff" stroke="#dce7d8" stroke-width="2"/>
    <rect x="80" y="29" width="120" height="77" rx="8" fill="#203d2c"/>
    <rect x="88" y="37" width="104" height="61" rx="4" fill="#305d41"/>
    <text x="100" y="70" fill="#d1e7c1" font-family="ui-monospace,monospace" font-size="15">$ gala</text>
    <path d="M65 111h150l12 10H53Z" fill="#93b59c"/>
    <text x="140" y="143" fill="#2a4833" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="730">Linux checkout</text>
  </g>
  <g transform="translate(460 90)">
    <rect width="280" height="160" rx="22" fill="#fff" stroke="#dce7d8" stroke-width="2"/>
    <rect x="96" y="24" width="88" height="92" rx="10" fill="#294c37"/>
    <rect x="108" y="35" width="64" height="58" rx="5" fill="#d9e9d1"/>
    <path d="M136 79c-6-8-17-7-21 2-5 11 3 25 12 25 4 0 5-2 9-2s5 2 9 2c9 0 17-14 12-25-4-9-15-10-21-2Z" fill="#e87960"/>
    <path d="M138 76c3-9 10-14 18-14-3 10-9 15-18 14Z" fill="#92bb88"/>
    <text x="140" y="143" fill="#2a4833" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="730">Mac builder</text>
  </g>
  <g transform="translate(872 90)">
    <rect width="280" height="160" rx="22" fill="#fff" stroke="#dce7d8" stroke-width="2"/>
    <rect x="111" y="18" width="58" height="102" rx="12" fill="#203d2c"/>
    <rect x="116" y="23" width="48" height="92" rx="9" fill="#f4f7ee"/>
    <rect x="123" y="43" width="34" height="34" rx="8" fill="#315d43"/>
    <path d="M139 52c-5-4-10-2-11 3-2 6 2 15 8 14 2 0 2-1 4-1s2 1 4 1c6 1 10-8 8-14-2-5-7-7-12-3Z" fill="#e87960"/>
    <text x="140" y="143" fill="#2a4833" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="15" font-weight="730">iPhone or iPad</text>
  </g>
  <path d="M342 169h99" stroke="#e87960" stroke-width="4" stroke-linecap="round"/>
  <path d="m434 160 10 9-10 9" fill="none" stroke="#e87960" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="392" y="152" fill="#778c7a" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12">rsync + SSH</text>
  <path d="M754 169h99" stroke="#e87960" stroke-width="4" stroke-linecap="round"/>
  <path d="m846 160 10 9-10 9" fill="none" stroke="#e87960" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="804" y="152" fill="#778c7a" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12">private HTTPS</text>
  <text x="600" y="286" fill="#6f8b73" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13">The Mac keeps one current IPA per project. The device installs it with Apple's system installer.</text>
</svg>
