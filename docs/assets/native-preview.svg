<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Gala native app preview</title>
  <desc id="desc">Illustrated iPhone screens showing the Gala build library and a live IPA transfer.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f9f8f1"/><stop offset="1" stop-color="#e5efd9"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#2c6547"/><stop offset="1" stop-color="#153c29"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="17" stdDeviation="22" flood-color="#173e2b" flood-opacity=".19"/></filter>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <circle cx="1068" cy="35" r="275" fill="#c3dfab" opacity=".30"/>
  <circle cx="35" cy="622" r="245" fill="#f3b9a3" opacity=".25"/>
  <text x="70" y="80" fill="#1e432e" font-family="system-ui,Arial,sans-serif" font-size="33" font-weight="760">Native on iPhone and iPad</text>
  <text x="72" y="111" fill="#5e7a66" font-family="system-ui,Arial,sans-serif" font-size="17">A live build library, direct install handoff, and transfer feedback.</text>
  <text x="72" y="603" fill="#819784" font-family="system-ui,Arial,sans-serif" font-size="13" letter-spacing="1.2">ILLUSTRATED UI PREVIEW</text>
  <g filter="url(#shadow)" transform="translate(300 139)">
    <rect width="265" height="510" rx="41" fill="#17231b"/>
    <rect x="9" y="9" width="247" height="492" rx="34" fill="#f7f7f0"/>
    <rect x="90" y="14" width="86" height="16" rx="8" fill="#17231b"/>
    <text x="25" y="62" fill="#25442e" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="750">Gala</text>
    <rect x="23" y="82" width="219" height="150" rx="22" fill="url(#card)"/>
    <text x="42" y="113" fill="#cae8ca" font-family="system-ui,Arial,sans-serif" font-size="9" letter-spacing="1.1">YOUR PRIVATE BUILD STATION</text>
    <text x="42" y="153" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="740">Fresh builds.</text>
    <text x="42" y="180" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="740">Ready when you are.</text>
    <text x="26" y="268" fill="#26422e" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="740">Current builds</text>
    <circle cx="229" cy="258" r="4" fill="#78b583"/>
    <rect x="23" y="285" width="219" height="139" rx="19" fill="#fff" stroke="#dce8d8"/>
    <rect x="38" y="302" width="43" height="43" rx="13" fill="#dfeecf"/>
    <text x="53" y="332" fill="#386f46" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="740">S</text>
    <text x="91" y="318" fill="#29442f" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="730">SwiftTodo</text>
    <text x="91" y="337" fill="#809285" font-family="system-ui,Arial,sans-serif" font-size="10">Build 4 · 66 KB</text>
    <text x="39" y="366" fill="#8a9b8f" font-family="system-ui,Arial,sans-serif" font-size="10">Ready on iPhone and iPad</text>
    <rect x="38" y="380" width="187" height="30" rx="14" fill="#e77861"/>
    <text x="100" y="400" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="720">Install update</text>
    <rect x="95" y="479" width="75" height="4" rx="2" fill="#1d2e21"/>
  </g>
  <g filter="url(#shadow)" transform="translate(645 139)">
    <rect width="265" height="510" rx="41" fill="#17231b"/>
    <rect x="9" y="9" width="247" height="492" rx="34" fill="#f7f7f0"/>
    <rect x="90" y="14" width="86" height="16" rx="8" fill="#17231b"/>
    <text x="25" y="62" fill="#25442e" font-family="system-ui,Arial,sans-serif" font-size="22" font-weight="750">Gala</text>
    <rect x="23" y="82" width="219" height="150" rx="22" fill="url(#card)"/>
    <text x="42" y="113" fill="#cae8ca" font-family="system-ui,Arial,sans-serif" font-size="9" letter-spacing="1.1">YOUR PRIVATE BUILD STATION</text>
    <text x="42" y="153" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="740">Fresh builds.</text>
    <text x="42" y="180" fill="#fff" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="740">Ready when you are.</text>
    <text x="26" y="268" fill="#26422e" font-family="system-ui,Arial,sans-serif" font-size="17" font-weight="740">Current builds</text>
    <rect x="23" y="285" width="219" height="162" rx="19" fill="#fff" stroke="#dce8d8"/>
    <rect x="38" y="302" width="43" height="43" rx="13" fill="#dfeecf"/>
    <text x="53" y="332" fill="#386f46" font-family="system-ui,Arial,sans-serif" font-size="23" font-weight="740">S</text>
    <text x="91" y="318" fill="#29442f" font-family="system-ui,Arial,sans-serif" font-size="14" font-weight="730">SwiftTodo</text>
    <text x="91" y="337" fill="#809285" font-family="system-ui,Arial,sans-serif" font-size="10">Build 4 · 66 KB</text>
    <text x="39" y="371" fill="#25442e" font-family="system-ui,Arial,sans-serif" font-size="11" font-weight="730">Sending IPA to iOS</text>
    <rect x="39" y="380" width="186" height="8" rx="4" fill="#e5ebe2"/>
    <rect x="39" y="380" width="127" height="8" rx="4" fill="#e77861"/>
    <text x="39" y="407" fill="#8a9b8f" font-family="system-ui,Arial,sans-serif" font-size="10">68% sent by the Mac</text>
    <text x="39" y="429" fill="#698271" font-family="system-ui,Arial,sans-serif" font-size="9">iOS finishes installation on the device.</text>
    <rect x="95" y="479" width="75" height="4" rx="2" fill="#1d2e21"/>
  </g>
</svg>
